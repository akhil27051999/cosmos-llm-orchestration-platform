## Values for grafana/loki chart (single binary mode for simplicity)
## https://github.com/grafana/loki/tree/main/production/helm/loki

# Single binary mode (simpler than scalable; fine for our scale)
deploymentMode: SingleBinary

singleBinary:
  replicas: 1
  nodeSelector:
    type: dependent_services
  persistence:
    enabled: true
    size: 5Gi
    storageClass: standard
  # Fix permission errors on PVC
  podSecurityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  containerSecurityContext:
    runAsUser: 10001
    runAsGroup: 10001
    runAsNonRoot: true

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: 2024-04-01
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 168h   # 7 days
    allow_structured_metadata: false

# Disable everything except SingleBinary (avoids needing object storage)
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# Don't deploy gateway/canary/test
gateway:
  enabled: false
test:
  enabled: false
lokiCanary:
  enabled: false

# Disable chunks-cache and results-cache (not needed for single binary)
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Service exposed for Grafana to query
service:
  type: ClusterIP
