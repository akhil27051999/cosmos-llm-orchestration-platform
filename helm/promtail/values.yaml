## Values for grafana/promtail chart
## https://github.com/grafana/helm-charts/tree/main/charts/promtail

# Promtail must run on every node to collect logs (DaemonSet — automatic)
# But we filter to only ship application logs to Loki

config:
  clients:
    - url: http://loki.observability.svc.cluster.local:3100/loki/api/v1/push

  snippets:
    # Override default scrape configs to only scrape student-api namespace
    scrapeConfigs: |
      - job_name: kubernetes-pods
        pipeline_stages:
          - cri: {}
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          # Only ship logs from student-api namespace (our application)
          - source_labels:
              - __meta_kubernetes_namespace
            action: keep
            regex: student-api
          - source_labels:
              - __meta_kubernetes_pod_label_app
            action: keep
            regex: flask-api
          - action: replace
            source_labels:
              - __meta_kubernetes_namespace
            target_label: namespace
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_label_app
            target_label: app
          - action: replace
            source_labels:
              - __meta_kubernetes_pod_container_name
            target_label: container
          - action: replace
            replacement: /var/log/pods/*$1/*.log
            separator: /
            source_labels:
              - __meta_kubernetes_pod_uid
              - __meta_kubernetes_pod_container_name
            target_label: __path__

# Promtail runs on every node by default to collect logs (DaemonSet)
# No nodeSelector — must be cluster-wide
