## Values for prometheus-community/prometheus-blackbox-exporter
## https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-blackbox-exporter

nodeSelector:
  type: dependent_services

config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
        valid_status_codes: [200, 201]
        method: GET
        preferred_ip_protocol: "ip4"

    http_post_2xx:
      prober: http
      timeout: 5s
      http:
        method: POST

    tcp_connect:
      prober: tcp
      timeout: 5s

service:
  type: ClusterIP
  port: 9115

serviceMonitor:
  enabled: false
