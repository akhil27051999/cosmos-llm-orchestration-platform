## Values for prometheus-community/prometheus chart
## https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus

# Pin Prometheus to the dependent_services node
server:
  nodeSelector:
    type: dependent_services
  persistentVolume:
    enabled: true
    size: 5Gi
    storageClass: standard
  retention: "7d"
  # Fix permission errors on PVC
  securityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
  service:
    type: ClusterIP
    servicePort: 9090

  # Custom scrape configs for our app, postgres-exporter, blackbox-exporter
  extraScrapeConfigs: |
    - job_name: 'flask-api'
      kubernetes_sd_configs:
        - role: pod
          namespaces:
            names:
              - student-api
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: flask-api
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "5000"
          action: keep
      metrics_path: /metrics

    - job_name: 'postgres-exporter'
      static_configs:
        - targets: ['prometheus-postgres-exporter.observability.svc.cluster.local:9187']

    - job_name: 'blackbox-http'
      metrics_path: /probe
      params:
        module: [http_2xx]
      static_configs:
        - targets:
            - http://flask-api-service.student-api.svc.cluster.local
            - http://argocd-server.argocd.svc.cluster.local
            - http://vault-service.vault.svc.cluster.local:8200/v1/sys/health
      relabel_configs:
        - source_labels: [__address__]
          target_label: __param_target
        - source_labels: [__param_target]
          target_label: instance
        - target_label: __address__
          replacement: prometheus-blackbox-exporter.observability.svc.cluster.local:9115

# Alertmanager bundled with this chart
alertmanager:
  enabled: true
  nodeSelector:
    type: dependent_services
  persistence:
    size: 1Gi
    storageClass: standard
  # Fix permission errors on PVC (pod-level for fsGroup)
  podSecurityContext:
    runAsUser: 65534
    runAsNonRoot: true
    runAsGroup: 65534
    fsGroup: 65534
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'severity']
      group_wait: 10s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null-receiver'
    receivers:
      - name: 'null-receiver'
      # Slack receiver — uncomment and set webhook URL to enable Slack alerts:
      # - name: 'slack-notifications'
      #   slack_configs:
      #     - api_url: 'https://hooks.slack.com/services/XXX/YYY/ZZZ'
      #       channel: '#alerts'
      #       send_resolved: true

# Node exporter — runs as DaemonSet on every node (cluster-wide metrics)
prometheus-node-exporter:
  enabled: true
  hostNetwork: true
  hostPID: true

# kube-state-metrics — single deployment for K8s object state
kube-state-metrics:
  enabled: true
  nodeSelector:
    type: dependent_services

# Push gateway — disabled (we don't need it)
prometheus-pushgateway:
  enabled: false

# Server config files (alerting rules)
serverFiles:
  alerting_rules.yml:
    groups:
      - name: node-alerts
        rules:
          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is above 80% for 5 minutes"

          - alert: HighDiskUsage
            expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes * 100 > 85
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High disk usage on {{ $labels.instance }}"
              description: "Disk usage is above 85% for 5 minutes"

      - name: app-alerts
        rules:
          - alert: HighRequestRate
            expr: sum(rate(flask_http_request_total[5m])) > 100
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High request rate on Flask API"
              description: "Request rate exceeded 100 req/s for 5 minutes"

          - alert: ErrorRateSpike
            expr: sum(rate(flask_http_request_total{status=~"5.."}[10m])) / sum(rate(flask_http_request_total[10m])) > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Error rate spike on Flask API"
              description: "5xx error rate exceeded 5% in last 10 minutes"

          - alert: HighP99Latency
            expr: histogram_quantile(0.99, rate(flask_http_request_duration_seconds_bucket[5m])) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "p99 latency exceeded 1s"
              description: "p99 latency on Flask API > 1s for 5 minutes"

      - name: pod-restart-alerts
        rules:
          - alert: VaultPodRestarted
            expr: increase(kube_pod_container_status_restarts_total{namespace="vault"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Vault pod restarted"
              description: "Vault pod has restarted in {{ $labels.namespace }}"

          - alert: ArgoCDServerRestarted
            expr: increase(kube_pod_container_status_restarts_total{namespace="argocd",pod=~"argocd-server.*"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "ArgoCD server restarted"
              description: "ArgoCD server pod restarted"

          - alert: PostgresPodRestarted
            expr: increase(kube_pod_container_status_restarts_total{namespace="student-api",pod=~"postgres.*"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Postgres pod restarted"
              description: "Postgres pod restarted in student-api"

      - name: blackbox-alerts
        rules:
          - alert: EndpointDown
            expr: probe_success == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Endpoint {{ $labels.instance }} is down"
              description: "Blackbox probe failed for 2 minutes"

          - alert: HighEndpointLatency
            expr: probe_duration_seconds > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High latency on {{ $labels.instance }}"
              description: "Probe duration > 1s for 5 minutes"
