## Values for grafana/grafana chart
## https://github.com/grafana/helm-charts/tree/main/charts/grafana

# Pin Grafana to dependent_services node
nodeSelector:
  type: dependent_services

persistence:
  enabled: true
  size: 2Gi
  storageClassName: standard

# Admin credentials sourced from existing K8s secret (created via Vault/ESO ideally)
admin:
  existingSecret: ""   # leave blank for default; we'll create our own below
adminUser: admin
adminPassword: admin   # change in production via --set

service:
  type: ClusterIP
  port: 80

# Pre-configured data sources (Prometheus + Loki)
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-server.observability.svc.cluster.local
        access: proxy
        isDefault: true

      - name: Loki
        type: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
        jsonData:
          maxLines: 1000

# Pre-loaded dashboard providers (load from ConfigMaps)
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

# Dashboards from grafana.com or local ConfigMaps
# IDs from https://grafana.com/grafana/dashboards/
dashboards:
  default:
    # Node Exporter metrics
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus

    # kube-state-metrics — K8s cluster overview
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus

    # Postgres exporter dashboard
    postgres:
      gnetId: 9628
      revision: 7
      datasource: Prometheus

    # Blackbox exporter
    blackbox:
      gnetId: 7587
      revision: 3
      datasource: Prometheus

    # Loki — application logs
    logs:
      gnetId: 13639
      revision: 2
      datasource: Loki
